<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterio - A Letter For You</title>

  <!-- 1. Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- 2. External Libraries (CRITICAL for features to work) -->
  <!-- html2canvas: For the "Save as Image" feature -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- DOMPurify: For XSS Security when rendering HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <!-- 3. Stylesheets -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Note: If you put your dark mode CSS in a separate file, uncomment the line below: -->
  <!-- <link rel="stylesheet" href="darkmode.css"> -->
</head>
<body>

  <!-- ==========================================
       THE ENVELOPE OVERLAY 
       Covers the screen until the user opens it
       ========================================== -->
  <div id="envelope-overlay" class="envelope-overlay">
    <div class="envelope-content">
      <p id="envelope-status">Retrieving your letter...</p>
      <!-- The Wax Seal Button -->
      <button id="wax-seal" class="wax-seal" disabled>
        <span class="wax-seal-text">Open</span>
      </button>
    </div>
  </div>

  <!-- ==========================================
       PAGE HEADER 
       ========================================== -->
  <header>
    <!-- animate-fade-up handles the elegant entrance -->
    <div class="header--navbar--wrapper animate-fade-up delay-1">
      <div class="logo" style="font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: bold;">
        Letterio
      </div>
      
      <!-- The darkmode.js script will automatically inject the Moon/Sun toggle button inside this <nav> -->
      <nav style="display: flex; align-items: center; gap: 16px;">
        <a href="/" style="color: inherit; text-decoration: none;">Home</a>
      </nav>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT (THE LETTER)
       ========================================== -->
  <main>
    <!-- app.js will inject the fetched letter data directly into this container -->
    <section class="letter--section--container">
      <!-- Leave this empty. JavaScript handles the rest! -->
    </section>
  </main>

  <!-- ==========================================
       FOOTER
       ========================================== -->
  <footer class="lower--footer animate-fade-up delay-3">
    <p>&copy; 2026 Letterio. Built with ❤️</p>
  </footer>

  <!-- ==========================================
       YOUR JAVASCRIPT FILES
       ========================================== -->
  <!-- Handles the dark mode toggle and saves preference -->
  <script src="darkmode.js"></script>
  <!-- Handles the API fetch, Typewriter, Speech, and Image Saving -->
  <script src="app.js"></script>

</body>
</html>
